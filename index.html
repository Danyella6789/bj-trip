<style>
:root{--bg:#F6F4F0;--surface:#FFF;--border:#E6E1DA;--muted:#8C877E;--body:#2B2820;
--accent:#2A6FDB;--accent-lt:#EBF1FB;--success:#2D7D46;--warn:#B45309;
--font:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
--safe-b:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--body);font-family:var(--font);font-size:15px;line-height:1.6;
padding-bottom:calc(58px + var(--safe-b))}

/* 顶栏 */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr-top{padding:12px 16px 8px;display:flex;align-items:baseline;gap:8px}
.hdr-t{font-size:16px;font-weight:700}
.hdr-s{font-size:11px;color:var(--muted)}
.daybar{display:flex;gap:7px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.daybar::-webkit-scrollbar{display:none}
.dpill{flex-shrink:0;padding:6px 12px;border-radius:16px;border:1.5px solid var(--border);
background:#fff;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;
transition:all .15s;cursor:pointer}
.dpill.on{color:#fff;border-color:transparent}
.dpill .wd{font-size:10px;opacity:.75;margin-left:3px;font-weight:500}

/* 内容 */
.wrap{padding:14px 14px 20px}
.pane{display:none}
.pane.on{display:block}

/* 日头 */
.dhead{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px;
box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--accent)}
.dh-d{font-size:21px;font-weight:700;letter-spacing:-.01em}
.dh-d span{font-size:13px;font-weight:400;color:var(--muted);margin-left:5px}
.dh-t{font-size:14px;font-weight:600;margin-top:1px}
.dh-h{font-size:11.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--border)}

/* 地图 */
.mapbox{height:230px;border-radius:14px;overflow:hidden;margin-bottom:12px;
box-shadow:0 1px 3px rgba(0,0,0,.06);position:relative}
#map{width:100%;height:100%;background:#E8E4DE}
.maptip{position:absolute;left:8px;bottom:8px;z-index:400;background:rgba(255,255,255,.92);
padding:3px 8px;border-radius:10px;font-size:10px;color:var(--muted);pointer-events:none}

/* 时间轴 */
.tl{border-left:2px solid var(--border);margin-left:9px;padding-left:15px}
.ti{position:relative;padding-bottom:14px}
.ti::before{content:'';position:absolute;left:-21px;top:6px;width:9px;height:9px;
border-radius:50%;background:#fff;border:2px solid var(--border)}
.ti.key::before{background:var(--accent);border-color:var(--accent)}
.ti.meal::before{background:var(--warn);border-color:var(--warn)}
.ti-c{background:#fff;border-radius:11px;padding:11px 13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.ti-t{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.ti-h{font-size:14.5px;font-weight:600;margin:1px 0 4px;line-height:1.35}
.ti-d{font-size:12.5px;color:#5A554D;line-height:1.55}
.ti-w{font-size:11.5px;color:var(--warn);margin-top:7px;padding:6px 9px;
background:#FFF7ED;border-radius:7px;line-height:1.45}
.cp{display:inline-block;padding:2px 8px;border-radius:9px;font-size:10px;
font-weight:700;margin:0 4px 3px 0}
.c-metro{background:#EBF1FB;color:#2A6FDB}
.c-taxi{background:#FEF3C7;color:#92400E}
.c-walk{background:#ECFDF5;color:#065F46}
.c-train{background:#F3E8FF;color:#6B21A8}

/* TODO */
.tdg{margin-bottom:18px}
.tdg-t{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:8px;padding-left:2px}
.td{display:flex;gap:10px;padding:11px 13px;background:#fff;border-radius:11px;
margin-bottom:7px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;
transition:opacity .15s;-webkit-user-select:none;user-select:none}
.td:active{opacity:.6}
.td.urg{border-left:3px solid var(--warn)}
.td.done{opacity:.45}
.td.done .td-t{text-decoration:line-through}
.cb{width:19px;height:19px;border-radius:6px;border:2px solid var(--border);
flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.td.done .cb{background:var(--success);border-color:var(--success)}
.td.done .cb::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.td-t{font-size:13.5px;font-weight:600;line-height:1.4}
.td-m{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.prog{background:#fff;border-radius:11px;padding:11px 14px;margin-bottom:14px;
font-size:12px;color:var(--muted);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.prog b{color:var(--accent);font-size:15px}
.pbar{height:5px;background:var(--bg);border-radius:3px;margin-top:7px;overflow:hidden}
.pfill{height:100%;background:var(--success);border-radius:3px;transition:width .3s}

/* 总览 */
.ov{background:#fff;border-radius:12px;padding:13px 15px;margin-bottom:9px;
box-shadow:0 1px 2px rgba(0,0,0,.05);border-left:4px solid;cursor:pointer}
.ov:active{opacity:.6}
.ov-d{font-size:11px;font-weight:700;color:var(--muted)}
.ov-t{font-size:15px;font-weight:600;margin:1px 0 3px}
.ov-h{font-size:11px;color:var(--muted)}
.note{background:#fff;border-radius:12px;padding:14px 16px;margin-top:14px;
font-size:12px;color:#5A554D;line-height:1.75;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.note b{color:var(--body)}
.note-h{font-size:13px;font-weight:700;color:var(--body);margin-bottom:6px}

/* 底部导航 */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;
background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--border);
padding-bottom:var(--safe-b)}
.nb{flex:1;padding:9px 4px 8px;text-align:center;cursor:pointer;color:var(--muted);transition:color .15s}
.nb.on{color:var(--accent)}
.nb-i{font-size:19px;line-height:1.2}
.nb-l{font-size:10px;font-weight:600;margin-top:1px}
.badge{display:inline-block;min-width:15px;padding:0 4px;background:var(--warn);
color:#fff;border-radius:8px;font-size:9px;font-weight:700;line-height:15px;
vertical-align:2px;margin-left:2px}
@media(min-width:600px){body{max-width:520px;margin:0 auto;
box-shadow:0 0 40px rgba(0,0,0,.07)}.nav{max-width:520px;left:50%;transform:translateX(-50%)}}
</style>
</head>

</div>

const COLORS={hotel:'#3B82F6',scenic:'#10B981',food:'#F59E0B',transport:'#8B5CF6'};
let map=null, layer=null, cur=null;

/* ---------- WGS84 -> GCJ02（高德瓦片用火星坐标） ---------- */
const _PI=3.1415926535897932384626, _A=6378245.0, _EE=0.00669342162296594323;
function _tl(x,y){let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
 r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;
 r+=(20*Math.sin(y*_PI)+40*Math.sin(y/3*_PI))*2/3;
 r+=(160*Math.sin(y/12*_PI)+320*Math.sin(y*_PI/30))*2/3;return r}
function _bl(x,y){let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
 r+=(20*Math.sin(6*x*_PI)+20*Math.sin(2*x*_PI))*2/3;
 r+=(20*Math.sin(x*_PI)+40*Math.sin(x/3*_PI))*2/3;
 r+=(150*Math.sin(x/12*_PI)+300*Math.sin(x/30*_PI))*2/3;return r}
function gcj(p){
  const lat=p[0],lng=p[1];
  let dla=_tl(lng-105,lat-35), dlo=_bl(lng-105,lat-35);
  const rl=lat/180*_PI; let m=Math.sin(rl); m=1-_EE*m*m;
  const sm=Math.sqrt(m);
  dla=(dla*180)/((_A*(1-_EE))/(m*sm)*_PI);
  dlo=(dlo*180)/(_A/sm*Math.cos(rl)*_PI);
  return [lat+dla,lng+dlo];
}
const P=k=>gcj(PLACES[k].p);

/* ---------- 地图 ---------- */
function initMap(){
  if(typeof L==='undefined') return;
  /* innerHTML 重建后旧的 #map 节点已脱离文档，此时必须重建地图实例 */
  if(map&&map._container&&document.body.contains(map._container)) return;
  if(map){try{map.remove()}catch(e){} map=null; layer=null;}
  const el=document.getElementById('map');
  if(!el) return;
  map=L.map(el,{zoomControl:false,attributionControl:false,tap:true});
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
    {subdomains:'1234',maxZoom:18,minZoom:3}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
}
function noMap(){
  document.querySelectorAll('#map').forEach(el=>{
    el.innerHTML='<div style="display:flex;align-items:center;justify-content:center;'+
    'height:100%;color:#8C877E;font-size:12px;text-align:center;padding:20px;line-height:1.7">'+
    '地图加载失败<br><span style="font-size:11px">不影响查看行程，导航请用高德/百度</span></div>';
  });
}
function drawDay(d){
  if(typeof L==='undefined'){noMap();return}
  initMap();
  if(!map) return;
  if(layer) map.removeLayer(layer);
  layer=L.layerGroup().addTo(map);
  const pts=d.route.map(P);
  L.polyline(pts,{color:d.color,weight:3.5,opacity:.85,dashArray:'6,7'}).addTo(layer);
  const seen=new Set();
  d.route.forEach((k,i)=>{
    if(seen.has(k)) return; seen.add(k);
    const pl=PLACES[k], c=COLORS[pl.t], sz=pl.t==='hotel'?20:16;
    L.marker(P(k),{icon:L.divIcon({
      html:'<div style="background:'+c+';width:'+sz+'px;height:'+sz+'px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',
      iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],className:''})})
      .addTo(layer).bindPopup('<b>'+pl.n+'</b><br><span style="color:#888;font-size:11px">'+(pl.d||'')+'</span>');
  });
  setTimeout(()=>{map.invalidateSize();
    map.fitBounds(L.polyline(pts).getBounds(),{padding:[35,35],maxZoom:14});},60);
}
function drawAll(){
  if(typeof L==='undefined'){noMap();return}
  initMap();
  if(!map) return;
  if(layer) map.removeLayer(layer);
  layer=L.layerGroup().addTo(map);
  DAYS.forEach(d=>{
    L.polyline(d.route.map(P),
      {color:d.color,weight:2.5,opacity:.6,dashArray:'5,6'}).addTo(layer);
  });
  Object.keys(PLACES).forEach(k=>{
    const pl=PLACES[k], c=COLORS[pl.t], sz=pl.t==='hotel'?16:12;
    L.marker(P(k),{icon:L.divIcon({
      html:'<div style="background:'+c+';width:'+sz+'px;height:'+sz+'px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)"></div>',
      iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],className:''})})
      .addTo(layer).bindPopup('<b>'+pl.n+'</b><br><span style="color:#888;font-size:11px">'+(pl.d||'')+'</span>');
  });
  setTimeout(()=>{map.invalidateSize();map.setView(gcj([39.96,116.33]),10);},60);
}

/* ---------- 渲染 ---------- */
function esc(x){return x==null?'':String(x)}
function renderDay(d){
  const items=d.items.map(it=>{
    const cls=it.key?'key':(it.meal?'meal':'');
    const cps=(it.chips||[]).map(c=>'<span class="cp '+c[0]+'">'+esc(c[1])+'</span>').join('');
    return '<div class="ti '+cls+'"><div class="ti-c">'+
      (it.time?'<div class="ti-t">'+esc(it.time)+'</div>':'')+
      '<div class="ti-h">'+esc(it.title)+'</div>'+
      '<div class="ti-d">'+cps+esc(it.desc)+'</div>'+
      (it.warn?'<div class="ti-w">⚠️ '+esc(it.warn)+'</div>':'')+
      '</div></div>';
  }).join('');
  document.getElementById('trip').innerHTML=
    '<div class="dhead" style="border-left-color:'+d.color+'">'+
      '<div class="dh-d">'+d.date+'<span>'+d.wd+'</span></div>'+
      '<div class="dh-t" style="color:'+d.color+'">'+esc(d.theme)+'</div>'+
      '<div class="dh-h">'+esc(d.hotel)+'</div></div>'+
    '<div class="mapbox"><div id="map"></div><div class="maptip">示意图 · 导航请用高德/百度</div></div>'+
    '<div class="tl">'+items+'</div>';
  drawDay(d);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderOverview(){
  const rows=DAYS.map(d=>
    '<div class="ov" style="border-left-color:'+d.color+'" data-go="'+d.id+'">'+
    '<div class="ov-d">'+d.date+' '+d.wd+'</div>'+
    '<div class="ov-t">'+esc(d.theme)+'</div>'+
    '<div class="ov-h">'+esc(d.hotel)+'</div></div>').join('');
  document.getElementById('trip').innerHTML=
    '<div class="dhead"><div class="dh-d">全部行程<span>9天</span></div>'+
    '<div class="dh-t">8/25 – 9/2 · 父母同行</div>'+
    '<div class="dh-h">点上方日期或下方卡片看当天安排</div></div>'+
    '<div class="mapbox"><div id="map"></div><div class="maptip">示意图 · 导航请用高德/百度</div></div>'+
    rows+
    '<div class="note"><div class="note-h">节奏设计</div>'+
    '• 8/26–8/27 被医院和清华占住，是"被动"两天<br>'+
    '• 8/27 清华+圆明园相邻，是全程最顺的一段<br>'+
    '• 8/28 上午颐和园、中午云南菜，下午必须午睡<br>'+
    '• 8/29 什刹海是最大步行日<br>'+
    '• 8/30 机动日兼搬家日，可雍和宫、可北大、也可整天休息<br>'+
    '• 9/1 故宫最累，前一晚在奥体早睡<br><br>'+
    '<b>换酒店 4 次</b>：8/27、8/30、8/31、9/1。其中 8/30 和 8/31 连着两天搬家，务必提前寄存行李。<br><br>'+
    '<b>早餐</b>：只有 8/31 和 9/2 两个早上酒店含早（海友），其余 6 天需在外解决。<br><br>'+
    '<b>三顿正餐</b>：8/27–8/28 清华食堂、8/28 中午知春路云南菜、8/29 中午什刹海烤鸭。</div>';
  drawAll();
  document.querySelectorAll('[data-go]').forEach(el=>
    el.onclick=()=>go(el.dataset.go));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- TODO ---------- */
const KEY='bj_h5_todos';
let done=JSON.parse(localStorage.getItem(KEY)||'{}');
function renderTodo(){
  let i=0,tot=0,dn=0;
  const html=TODOS.map(g=>{
    const its=g.items.map(it=>{
      const k=i++;tot++;if(done[k])dn++;
      return '<div class="td '+(g.urgent?'urg':'')+' '+(done[k]?'done':'')+'" data-k="'+k+'">'+
        '<div class="cb"></div><div><div class="td-t">'+esc(it.t)+'</div>'+
        '<div class="td-m">'+esc(it.m)+'</div></div></div>';
    }).join('');
    return '<div class="tdg"><div class="tdg-t">'+esc(g.g)+'</div>'+its+'</div>';
  }).join('');
  const pct=tot?Math.round(dn/tot*100):0;
  document.getElementById('todo').innerHTML=
    '<div class="prog">已完成 <b>'+dn+'</b> / '+tot+' 项'+(dn===tot?' 🎉 全部搞定':'')+
    '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div></div>'+html;
  document.querySelectorAll('[data-k]').forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;
    if(done[k])delete done[k];else done[k]=1;
    localStorage.setItem(KEY,JSON.stringify(done));
    renderTodo();
  });
  const left=tot-dn, b=document.getElementById('tdBadge');
  b.textContent=left||''; b.style.display=left?'inline-block':'none';
}

/* ---------- 导航 ---------- */
function go(id){
  cur=id;
  document.querySelectorAll('.dpill').forEach(p=>{
    const on=p.dataset.d===String(id);
    p.classList.toggle('on',on);
    p.style.background=on?(p.dataset.c||'#2A6FDB'):'#fff';
    if(on)p.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  });
  if(id===null) renderOverview();
  else renderDay(DAYS.find(d=>d.id===id));
  tab('trip');
}
function tab(n){
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===n));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.t===n));
  if(n==='trip'&&map) setTimeout(()=>map.invalidateSize(),60);
}

/* ---------- 启动 ---------- */
(function(){
  const bar=document.getElementById('daybar');
  const all=document.createElement('div');
  all.className='dpill';all.dataset.d='null';all.textContent='全部';
  all.onclick=()=>go(null);bar.appendChild(all);
  DAYS.forEach(d=>{
    const el=document.createElement('div');
    el.className='dpill';el.dataset.d=d.id;el.dataset.c=d.color;
    el.innerHTML=d.date+'<span class="wd">'+d.wd.slice(1)+'</span>';
    el.onclick=()=>go(d.id);bar.appendChild(el);
  });
  document.querySelectorAll('.nb').forEach(b=>b.onclick=()=>tab(b.dataset.t));
  renderTodo();
  go(null);
  /* Leaflet 迟到时重画当前页地图 */
  window.__mapRetry=function(){
    if(typeof L==='undefined')return;
    if(cur===null)drawAll();else{const d=DAYS.find(x=>x.id===cur);if(d)drawDay(d)}
  };
  if(typeof L==='undefined')setTimeout(()=>{if(typeof L==='undefined')noMap()},8000);
})();

</script>
</body>
</html>
